# Azure DevOps YAML Pipeline for Terraform Infrastructure Deployment
trigger:
  branches:
    include:
      - main

pool:
  name: 'Ranjan Agent'

variables:
  # Name of your Azure DevOps Service Connection connected to Azure Subscription ea6c786f-3f34-4f15-a6f8-88057a9b27b9
  azureServiceConnection: 'Azure-Service-Connection'
  workingDirectory: '$(System.DefaultWorkingDirectory)/Parent-Moudle'

stages:
- stage: Terraform_Validate_And_Plan
  displayName: 'Terraform Validate & Plan'
  jobs:
  - job: PlanJob
    displayName: 'Terraform Init & Plan'
    steps:
    - task: AzureCLI@2
      displayName: 'Terraform Init & Validate'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        addSpnToEnvironment: true
        workingDirectory: '$(workingDirectory)'
        inlineScript: |
          Write-Host "===> Exporting Azure Credentials for Terraform..."
          $env:ARM_CLIENT_ID = $env:servicePrincipalId
          $env:ARM_CLIENT_SECRET = $env:servicePrincipalKey
          $env:ARM_TENANT_ID = $env:tenantId
          $env:ARM_SUBSCRIPTION_ID = "ea6c786f-3f34-4f15-a6f8-88057a9b27b9"

          Write-Host "===> Checking Terraform Installation..."
          terraform -version

          Write-Host "===> Initializing Terraform Backend..."
          terraform init

          Write-Host "===> Validating Terraform Configurations..."
          terraform validate

    - task: AzureCLI@2
      displayName: 'Terraform Plan'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        addSpnToEnvironment: true
        workingDirectory: '$(workingDirectory)'
        inlineScript: |
          Write-Host "===> Exporting Azure Credentials for Terraform..."
          $env:ARM_CLIENT_ID = $env:servicePrincipalId
          $env:ARM_CLIENT_SECRET = $env:servicePrincipalKey
          $env:ARM_TENANT_ID = $env:tenantId
          $env:ARM_SUBSCRIPTION_ID = "ea6c786f-3f34-4f15-a6f8-88057a9b27b9"

          Write-Host "===> Running Terraform Plan..."
          terraform plan -out=tfplan

- stage: Terraform_Apply
  displayName: 'Terraform Apply'
  dependsOn: Terraform_Validate_And_Plan
  condition: succeeded()
  jobs:
  - deployment: ApplyJob
    displayName: 'Terraform Apply Infrastructure'
    environment: 'Production'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'Terraform Apply'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              workingDirectory: '$(workingDirectory)'
              inlineScript: |
                Write-Host "===> Exporting Azure Credentials for Terraform..."
                $env:ARM_CLIENT_ID = $env:servicePrincipalId
                $env:ARM_CLIENT_SECRET = $env:servicePrincipalKey
                $env:ARM_TENANT_ID = $env:tenantId
                $env:ARM_SUBSCRIPTION_ID = "ea6c786f-3f34-4f15-a6f8-88057a9b27b9"

                Write-Host "===> Checking Terraform Installation..."
                terraform -version

                Write-Host "===> Initializing Terraform Backend..."
                terraform init

                Write-Host "===> Applying Terraform Infrastructure..."
                terraform apply -auto-approve


